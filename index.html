<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola Aylu</title>
    <!-- Fuente bonita de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #1e3a8a; /* Azul simple */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        /* Contenedor principal inicial (El botón) */
        .welcome-container {
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .welcome-container.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            display: none;
        }

        .btn-presioname {
            background-color: #ffffff;
            color: #1e3a8a;
            border: none;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-presioname:hover {
            transform: scale(1.05);
            background-color: #f1f5f9;
        }

        /* La carta secreta (oculta al inicio) */
        .card-container {
            position: absolute;
            width: 90%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-container.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        h1 {
            color: #1e3a8a;
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .subtitle-joke {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 25px;
            font-style: italic;
        }

        .message-body {
            font-size: 1rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #1e3a8a;
        }

        .btn-cerrar {
            background: transparent;
            border: 2px solid #cbd5e1;
            color: #64748b;
            padding: 8px 20px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cerrar:hover {
            border-color: #1e3a8a;
            color: #1e3a8a;
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con el botón -->
    <div class="welcome-container" id="welcomeScreen">
        <button class="btn-presioname" onclick="mostrarCarta()">Presióname</button>
    </div>

    <!-- La carta bonita que aparece -->
    <div class="card-container" id="carta">
        <h1>Ola Aylu</h1>
        <p class="subtitle-joke">*(Sí, programé una página web entera solo para decirte esto, no me juzgues)*</p>
        
        <div class="message-body">
            <p>Sé que a veces la cago o que las cosas no son fáciles, pero la verdad es que <strong>no quiero perderte</strong>.</p>
            <br>
            <p>Quería buscar una forma sincera de recordarte que eres todo para mí y que de verdad me importas muchísimo.</p>
        </div>

        <button class="btn-cerrar" onclick="ocultarCarta()">Volver</button>
    </div>

    <script>
        function mostrarCarta() {
            const welcome = document.getElementById('welcomeScreen');
            const carta = document.getElementById('carta');

            welcome.classList.add('hidden');
            setTimeout(() => {
                carta.classList.add('show');
            }, 200);
        }

        function ocultarCarta() {
            const welcome = document.getElementById('welcomeScreen');
            const carta = document.getElementById('carta');

            carta.classList.remove('show');
            setTimeout(() => {
                welcome.classList.remove('hidden');
            }, 300);
        }
    </script>
</body>
</html>
